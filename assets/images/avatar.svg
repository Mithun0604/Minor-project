<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d17" />
      <stop offset="100%" stop-color="#121829" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <circle cx="100" cy="100" r="94" fill="url(#bgGrad)" stroke="url(#shieldGrad)" stroke-width="2.5" />
  <circle cx="100" cy="100" r="88" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Security Shield & Terminal Monogram -->
  <path d="M 100 48 L 142 66 C 142 108 122 138 100 152 C 78 138 58 108 58 66 Z" 
        fill="rgba(56, 189, 248, 0.05)" 
        stroke="url(#shieldGrad)" 
        stroke-width="2.5" 
        stroke-linejoin="round" />

  <!-- Inner Security Terminal Icon -->
  <g transform="translate(76, 82)">
    <!-- Terminal prompt: >_ -->
    <polyline points="4 6 16 18 4 30" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <line x1="24" y1="30" x2="44" y2="30" stroke="#a855f7" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Tech Accent Nodes -->
  <circle cx="100" cy="48" r="3.5" fill="#38bdf8" />
  <circle cx="58" cy="66" r="3" fill="#6366f1" />
  <circle cx="142" cy="66" r="3" fill="#a855f7" />
  <circle cx="100" cy="152" r="3.5" fill="#10b981" />
</svg>
