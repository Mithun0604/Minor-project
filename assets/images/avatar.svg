<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="avatarGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e111a" />
      <stop offset="100%" stop-color="#181c2b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="94" fill="url(#bgGrad)" stroke="url(#avatarGlow)" stroke-width="2.5" />
  <circle cx="100" cy="100" r="88" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Stylized Tech Figure -->
  <g transform="translate(0, 5)">
    <!-- Head / Face -->
    <circle cx="100" cy="75" r="32" fill="#1e2436" stroke="url(#avatarGlow)" stroke-width="2" />
    
    <!-- Stylized Hair / Cap -->
    <path d="M 68 72 C 70 48, 85 40, 100 40 C 115 40, 130 48, 132 72 C 122 66, 110 65, 100 66 C 90 65, 78 66, 68 72 Z" fill="url(#avatarGlow)" />

    <!-- Glasses / Visor -->
    <rect x="74" y="70" width="52" height="15" rx="7.5" fill="#0b0e17" stroke="#38bdf8" stroke-width="2" />
    <line x1="77" y1="77" x2="123" y2="77" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.8" />

    <!-- Smile / Chin -->
    <path d="M 92 93 Q 100 97 108 93" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" />

    <!-- Torso / Hoodie -->
    <path d="M 52 155 C 52 120, 75 112, 100 112 C 125 112, 148 120, 148 155 Z" fill="#161b2a" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
    <!-- Hoodie V -->
    <path d="M 88 113 L 100 132 L 112 113" fill="none" stroke="url(#avatarGlow)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Glowing Accent Dots -->
  <circle cx="45" cy="55" r="3" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="155" cy="65" r="2.5" fill="#a855f7" filter="url(#glow)" />
  <circle cx="160" cy="140" r="3" fill="#10b981" filter="url(#glow)" />
</svg>
